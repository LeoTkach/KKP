services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/outputs
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./configs:/app/configs:ro
    command: ["python", "-m", "kkp.train", "--config", "/app/configs/default.yaml"]

  dev:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/outputs
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: ["bash"]

  jupyter:
    build:
      context: .
      target: dev
    env_file:
      - .env
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/app
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --NotebookApp.token=
      - --NotebookApp.password=

  lint:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    command: ["ruff", "check", "src", "tests"]

  test:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    command: ["pytest", "-v", "--cov=kkp", "--cov-report=term-missing"]
