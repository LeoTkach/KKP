[project]
name = "kkp"
version = "0.1.0"
description = "KKP (Комплексний курсовий проєкт): детекція AI- та відредагованих зображень"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "torch>=2.3",
    "torchvision>=0.18",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "ipython>=8.26",
    "jupyterlab>=4.2",
]
demo = [
    "gradio>=5.0",
]
data = [
    "datasets>=3.0",
]

[project.scripts]
kkp-train = "kkp.train:main"
kkp-evaluate = "kkp.evaluate:main"
kkp-demo = "kkp.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kkp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["kkp"]
omit = ["tests/*"]
