# Ablation: EfficientNet-B0, hi-res, strong_augment=true, 5 epochs

project:
  name: kkp-ablation-effnet-epochs5
  seed: 42

paths:
  data_dir: ${DATA_DIR:-./data}/ai_hires
  output_dir: ${OUTPUT_DIR:-./outputs}/ablation_effnet_epochs5

training:
  batch_size: 32
  epochs: 5
  learning_rate: 0.001
  device: ${DEVICE:-cpu}
  image_size: 224

data:
  task: ai_generated
  classes:
    - real
    - ai_generated
  val_split: 0.1
  strong_augment: true
  min_side: 128
  extra_train_dir: null

model:
  name: efficientnet_b0
  num_classes: 2
  pretrained: true

datasets:
  primary: split_folder
  layout:
    train: train/{REAL,FAKE}
    val: val/{REAL,FAKE}
    test: test/{REAL,FAKE}
