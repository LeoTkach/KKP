# Підзадача 1 (legacy): CIFAKE 32×32 — baseline для порівняння в звіті

project:
  name: kkp-ai-generated-cifake
  seed: 42

paths:
  data_dir: ${DATA_DIR:-./data}/ai_generated
  output_dir: ${OUTPUT_DIR:-./outputs}/ai_generated_cifake

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  device: ${DEVICE:-cpu}
  image_size: 224

data:
  task: ai_generated
  classes:
    - real
    - ai_generated
  val_split: 0.1
  strong_augment: false
  min_side: 0
  extra_train_dir: null

model:
  name: resnet18
  num_classes: 2
  pretrained: true

datasets:
  primary: cifake
  layout:
    train: train/{REAL,FAKE}
    test: test/{REAL,FAKE}
