# Підзадача 2: original vs edited

project:
  name: kkp-edited
  seed: 42

paths:
  data_dir: ${DATA_DIR:-./data}/edited
  output_dir: ${OUTPUT_DIR:-./outputs}/edited

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  device: ${DEVICE:-cpu}
  image_size: 224

data:
  task: edited
  classes:
    - original
    - edited
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

model:
  name: resnet18
  num_classes: 2
  pretrained: true

datasets:
  # CASIA v2, Columbia splicing detection dataset
  primary: casia_v2
